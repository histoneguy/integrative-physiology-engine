name: CI
# WAS `on: [push, pull_request]`, CHANGED 2026-09-20 BECAUSE IT RAN EVERYTHING TWICE.
#
# A push to a PR branch fired BOTH events, so every push produced two identical
# `Julia tests` jobs. MEASURED, not assumed: each one saves a ~988 MiB Julia depot
# cache, and the Diagnostics workflow adds 418 MiB per run, so a single push wrote
# about 2.8 GB against GitHub's 10 GB per-repository cache limit. Roughly three
# pushes evicted everything, the restore key then missed, and the run paid a FULL
# precompile of all 322 dependencies.
#
# THE COST WAS 18 MINUTES OF PRECOMPILATION ON A 2m32s SUITE. Step timings from run
# 35483681345 against 35469037827: cache restore 17s in both, buildpkg 3s in both,
# julia-runtest 1233s against 186s, and the test suite itself 2m33.4s against
# 2m31.7s. The suite is constant; the variance was entirely cache misses.
#
# `pull_request` still covers every PR, so the required `Provenance` check still
# runs on everything that can be merged. The job NAMES are untouched - CLAUDE.md
# records that renaming `Provenance` once deadlocked every merge.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ledger:
    name: Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # Fails if any parameter lacks a citation, units, valid tier, or extraction
      # method - and if generated code is stale relative to the ledger. This is what
      # makes SOURCES.md mechanically enforced rather than aspirational.
      - run: python3 tools/ledger_to_julia.py --check
      # Disciplines TOPOLOGY the way the ledger disciplines numbers. A wrong
      # parameter is re-estimated; a wrong structure invalidates the estimation
      # that rests on it. See ADR 0006.
      - run: python3 tools/check_adrs.py
      # Julia refuses to load a package importing an undeclared module,
      # including stdlibs. Catch that here rather than in a 20-minute
      # precompile.
      - run: python3 tools/fix_deps.py
      # Derived values depend on each other. The ledger records provenance;
      # this checks that numbers derived from one another still agree.
      - run: python3 tools/check_closure.py
      # The ledger disciplines NUMBERS; this disciplines EQUATIONS. Every `~`
      # relation in src/components must have a row in ledger/relations.csv, and
      # every empirical one must carry a form_citation. Forward-only: eight
      # pre-existing unsourced relations are grandfathered inside the script and
      # reported as debt. It fails on anything NEW, and on a grandfather entry
      # that has gone stale. Landing it red would have deadlocked every merge,
      # since this job is the required status check.
      - run: python3 tools/check_relations.py --repo .
      # A tolerance tighter than its target's significant figures tests digits
      # nobody measured. Directives 1.9, 1.13 and 1.14 all say so and were all
      # ignored, so this is the version that fails a build. A tight comparison
      # against a constant the model is DERIVED from is legitimate and must say
      # so with a CLOSURE PIN or WIRING PIN comment - the gate does not guess.
      - run: python3 tools/check_tolerances.py

  test:
    name: Julia tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with: { version: '1.12' }
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
