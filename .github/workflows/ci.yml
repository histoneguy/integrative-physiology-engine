name: CI
on: [push, pull_request]

jobs:
  ledger:
    name: Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # Fails if any parameter lacks a citation, units, valid tier, or extraction
      # method - and if generated code is stale relative to the ledger. This is what
      # makes SOURCES.md mechanically enforced rather than aspirational.
      - run: python3 tools/ledger_to_julia.py --check
      # Disciplines TOPOLOGY the way the ledger disciplines numbers. A wrong
      # parameter is re-estimated; a wrong structure invalidates the estimation
      # that rests on it. See ADR 0006.
      - run: python3 tools/check_adrs.py
      # Julia refuses to load a package importing an undeclared module,
      # including stdlibs. Catch that here rather than in a 20-minute
      # precompile.
      - run: python3 tools/fix_deps.py
      # Derived values depend on each other. The ledger records provenance;
      # this checks that numbers derived from one another still agree.
      - run: python3 tools/check_closure.py
      # The ledger disciplines NUMBERS; this disciplines EQUATIONS. Every `~`
      # relation in src/components must have a row in ledger/relations.csv, and
      # every empirical one must carry a form_citation. Forward-only: eight
      # pre-existing unsourced relations are grandfathered inside the script and
      # reported as debt. It fails on anything NEW, and on a grandfather entry
      # that has gone stale. Landing it red would have deadlocked every merge,
      # since this job is the required status check.
      - run: python3 tools/check_relations.py --repo .

  test:
    name: Julia tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with: { version: '1.12' }
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
